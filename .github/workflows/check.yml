# Every document is what tools/build_maps.py writes. A hand edit to a .json the builder knows about
# would be overwritten by the next build with nothing to say so; this says so first.
#
# Building every map and checking its spawns and props is game-zombie-zone's job
# (examples/headless_maps.tscn), because it needs the game; this repository's own check is
# only that its documents and its builder agree.
name: Check

on:
    push:
        branches: ['**']
    pull_request:
    workflow_dispatch:

jobs:
    build-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/checkout@v4
              with:
                  repository: gamespice-platform/map-convert
                  path: gs-map-convert-src
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - run: python3 tools/build_maps.py --check
            - run: python3 tools/build_provides.py --check
              env:
                  GS_MAP_CONVERT_PATH: gs-map-convert-src

    # Every world's art slices are published where a player's client reads them. Red means a world is stamped with a slice the
    # store does not have (the client then draws plain materials); fix by republishing or restamping (tools/ship_store.sh).
    store-published:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/checkout@v4
              with:
                  repository: gamespice-platform/map-convert
                  path: gs-map-convert-src
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - run: tools/check_store.sh
              env:
                  GSBSP_PATH: gs-map-convert-src
                  ORIGIN: https://content.gamespice.net
