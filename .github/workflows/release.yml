# Tag it (v*) and the maps are attached to the GitHub Release as
# zombie-zone-maps-<version>-pack.zip, which website-city's release sync publishes and signs
# as gamemann/zombie-zone-maps. A server owner names that pack in their map config, so a
# server mounts it beside the game and a player never downloads it.
#
# It signs nothing and publishes nothing itself; see modcommunity/dot-ci.
name: Release

on:
    push:
        tags: ['v*']

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - run: python3 tools/build_maps.py --check

    release:
        needs: check
        uses: modcommunity/dot-ci/.github/workflows/release.yml@v1.2.4
        permissions:
            contents: write
        with:
            pack: true
            # Data, with no scripts and no addons: there is no requires.json to compare
            # against a server's addons.
            server-compat: false
            # The drawn worlds are the client's, one pack per map (the job below); the server
            # never draws, so its pack leaves them out.
            pack-exclude-dirs: world

    # Each converted map's drawn world (tools/build_worlds.py) as a pack of its own,
    # zz_world_<id>-<version>-pack.zip, published as <owner>/zz_world_<id>@<version>: a client
    # fetches the one for the map the server it joined is on, by the key the server sends
    # (game-zombie-zone's ZzModule._world_key: the maps pack's owner and version). After the
    # release job, which creates the release.
    worlds:
        needs: release
        uses: modcommunity/dot-ci/.github/workflows/release-maps.yml@v1.2.6
        permissions:
            contents: write
        with:
            game: zees-games/game-zombie-zone
            maps-dir: world
            link-at: world
